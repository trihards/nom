<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>EL YES! Cookbook</title>
<style>

/* === RESET & BASE === */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg:         #f5f0e8;
  --surface:    #ffffff;
  --surface2:   #faf7f3;
  --surface3:   #f0ebe2;
  --accent:     #b8700e;
  --accent-dim: #7a4a06;
  --accent-hi:  #d4870a;
  --accent-bg:  #fdf4e4;
  --text:       #1c1208;
  --muted:      #7a6a58;
  --dim:        #b8a898;
  --border:     #e2d8c8;
  --border-mid: #c8b89e;
  --green:      #2a7038;
  --green-bg:   #eef7f1;
  --green-bdr:  #a0d0ae;
  --red:        #b83030;
  --red-bg:     #fdf0f0;
  --warn:       #b8700e;
  --warn-bg:    #fdf4e4;
  --warn-bdr:   #e8b870;
}
html { font-size: 15px; -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  line-height: 1.5;
  min-height: 100vh;
}
button { font-family: inherit; cursor: pointer; }
::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--border-mid); border-radius: 3px; }

/* === LIBRARY === */
#lib-view { max-width: 960px; margin: 0 auto; padding: 48px 24px 80px; }

.lib-hdr { margin-bottom: 40px; }
.lib-hdr h1 {
  font-size: 28px; font-weight: 700; letter-spacing: -0.6px;
  color: var(--text); margin-bottom: 4px;
}
.lib-hdr h1 span { color: var(--accent); }
.lib-hdr .lib-sub { color: var(--muted); font-size: 14px; margin-bottom: 16px; }
.lib-meta { display: flex; gap: 10px; flex-wrap: wrap; }
.lib-pill {
  font-size: 12px; color: var(--muted);
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 20px; padding: 4px 12px;
}
.lib-pill span { color: var(--accent); font-weight: 600; }

.recipe-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
  gap: 14px;
}
.recipe-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 12px; padding: 20px 22px;
  display: flex; flex-direction: column; gap: 10px;
  transition: border-color .2s, box-shadow .2s;
}
.recipe-card:not(.placeholder) { cursor: pointer; }
.recipe-card:not(.placeholder):hover {
  border-color: var(--accent-dim);
  box-shadow: 0 2px 12px rgba(180,112,14,0.10);
}
.recipe-card.placeholder { opacity: .5; }

.card-tags { display: flex; flex-wrap: wrap; gap: 5px; }
.card-tag {
  font-size: 11px; font-weight: 600; letter-spacing: 0.3px;
  color: var(--accent); background: var(--accent-bg);
  border: 1px solid var(--warn-bdr); border-radius: 4px; padding: 2px 7px;
}
.card-title { font-size: 16px; font-weight: 600; color: var(--text); line-height: 1.35; }
.card-style { font-size: 12px; color: var(--muted); font-style: italic; line-height: 1.4; margin-top: 2px; }
.card-sub { font-size: 12px; color: var(--dim); line-height: 1.4; margin-top: 2px; }
.card-soon { font-size: 12px; color: var(--dim); margin-top: auto; }

/* Filter bar */
.filter-bar {
  display: flex; flex-wrap: wrap; align-items: center;
  gap: 8px; margin-bottom: 28px;
}
.filter-search {
  flex: 1; min-width: 180px; max-width: 300px;
  font-size: 13px; color: var(--text);
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 8px; padding: 7px 12px;
  outline: none; transition: border-color .15s;
}
.filter-search::placeholder { color: var(--dim); }
.filter-search:focus { border-color: var(--accent-dim); }
.filter-btn {
  font-size: 12px; font-weight: 600; letter-spacing: 0.2px;
  color: var(--muted); background: var(--surface);
  border: 1px solid var(--border); border-radius: 20px;
  padding: 5px 13px; cursor: pointer; transition: all .15s;
}
.filter-btn:hover { border-color: var(--accent-dim); color: var(--text); }
.filter-btn.active {
  background: var(--accent-bg); border-color: var(--warn-bdr);
  color: var(--accent);
}
.filter-count { font-size: 12px; color: var(--dim); margin-left: auto; }

.card-time {
  display: flex; gap: 12px; flex-wrap: wrap;
  font-size: 12px; color: var(--muted); margin-top: 2px;
}
.card-time-item { display: flex; align-items: center; gap: 4px; }
.card-time-lbl { font-weight: 600; color: var(--dim); text-transform: uppercase; letter-spacing: 0.5px; font-size: 10px; }
.card-time-val { color: var(--text); font-weight: 500; }

/* === COOK VIEW === */
#cook-view { display: none; }
#cook-view.active { display: block; }

/* Fixed header */
#cook-hdr {
  position: fixed; top: 0; left: 0; right: 0; z-index: 300;
  height: 54px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 10px; padding: 0 18px;
  box-shadow: 0 1px 6px rgba(0,0,0,0.06);
}
.back-btn {
  background: none; border: 1px solid var(--border); color: var(--muted);
  font-size: 13px; padding: 5px 10px; border-radius: 6px;
  transition: all .15s; white-space: nowrap; flex-shrink: 0;
}
.back-btn:hover { color: var(--text); border-color: var(--border-mid); }
#hdr-title {
  font-size: 14px; font-weight: 600; color: var(--text); flex: 1;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.preheat-badge {
  font-size: 11px; font-weight: 700; letter-spacing: 0.5px;
  color: var(--accent); background: var(--accent-bg);
  border: 1px solid var(--warn-bdr); border-radius: 5px;
  padding: 4px 9px; white-space: nowrap; flex-shrink: 0;
}
.recipe-headnote {
  font-size: 13px; color: var(--dim); line-height: 1.55;
  padding: 12px 2px 16px; border-bottom: 1px solid var(--border-mid);
  margin-bottom: 6px;
}
.recipe-headnote strong { color: var(--text); font-weight: 600; }
.recipe-headnote em { color: var(--muted); font-style: normal; font-size: 12px; }
.scale-toggle {
  display: flex; border: 1px solid var(--border); border-radius: 7px;
  overflow: hidden; flex-shrink: 0;
}
.scale-btn {
  background: none; border: none; color: var(--muted);
  font-size: 12px; font-weight: 700; padding: 5px 10px;
  transition: all .15s; letter-spacing: 0.2px;
}
.scale-btn + .scale-btn { border-left: 1px solid var(--border); }
.scale-btn.on { background: var(--accent); color: #fff; }
.scale-btn:not(.on):hover { background: var(--surface2); color: var(--text); }

/* Fixed timer bar */
#timer-bar {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 299;
  background: var(--surface2); border-top: 1px solid var(--border);
  max-height: 0; overflow: hidden;
  transition: max-height .25s ease, padding .25s ease;
  padding: 0 18px;
}
#timer-bar.vis { max-height: 70px; padding: 10px 18px; }
.t-pills { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.t-pill {
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 20px; padding: 5px 13px; flex-shrink: 0;
}
.t-pill.urg { border-color: var(--red); background: var(--red-bg); }
.t-pill.urg .t-count { color: var(--red); }
.t-pill.alerted {
  border-color: var(--warn-bdr); cursor: pointer;
  animation: amberpulse 1.2s ease-in-out infinite;
}
.t-pill.alerted .t-count {
  color: var(--warn); font-size: 11px; font-weight: 700;
  letter-spacing: 0.5px; text-transform: uppercase;
}
@keyframes amberpulse {
  0%, 100% { background: var(--surface); }
  50%       { background: var(--warn-bg); }
}
.t-name  { font-size: 12px; color: var(--muted); }
.t-count { font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; min-width: 40px; color: var(--text); }
.t-pill-src {
  font-size: 10px; color: var(--muted); background: var(--surface2);
  border: 1px solid var(--border); border-radius: 10px;
  padding: 1px 7px; cursor: pointer; white-space: nowrap;
  max-width: 120px; overflow: hidden; text-overflow: ellipsis;
}
.t-pill-src:hover { color: var(--text); border-color: var(--accent); }

/* Cook body */
#cook-body {
  padding-top: 70px;
  padding-left: 20px; padding-right: 20px; padding-bottom: 80px;
  max-width: 760px; margin: 0 auto;
  transition: padding-bottom .25s ease;
}
#cook-body.bar-vis { padding-bottom: 140px; }
#lib-view.bar-vis  { padding-bottom: 140px; }

/* Tabs */
.cook-tabs {
  display: flex; border: 1px solid var(--border);
  border-radius: 8px; overflow: hidden; margin-bottom: 18px;
  background: var(--surface);
}
.cook-tab {
  flex: 1; background: none; border: none; color: var(--muted);
  font-size: 12px; font-weight: 700; padding: 10px;
  letter-spacing: 1px; transition: all .15s;
}
.cook-tab.on { background: var(--accent); color: #fff; }
.cook-tab:not(.on):hover { background: var(--surface2); color: var(--text); }
.cook-tab + .cook-tab { border-left: 1px solid var(--border); }

/* Panes */
.cook-pane { display: none; }
.cook-pane.on { display: block; }

/* Section label */
.sec-lbl {
  font-size: 12px; font-weight: 700; letter-spacing: 1.5px;
  color: var(--accent); text-transform: uppercase;
  margin: 22px 0 0; padding-bottom: 6px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 8px;
  cursor: pointer; user-select: none;
  transition: color .2s;
}
.sec-lbl:first-child { margin-top: 4px; }
.mise-section.collapsed .sec-lbl { color: var(--accent-dim); border-bottom-color: transparent; }

/* Section collapse checkbox */
.sec-cb {
  width: 15px; height: 15px; border: 1.5px solid var(--border-mid);
  border-radius: 3px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  transition: all .15s;
}
.mise-section.collapsed .sec-cb { background: var(--green); border-color: var(--green); }
.sec-cb-mark { color: white; font-size: 9px; font-weight: 800; opacity: 0; line-height: 1; }
.mise-section.collapsed .sec-cb-mark { opacity: 1; }

/* Collapsible items wrapper */
.sec-items {
  overflow: hidden;
  max-height: 2000px;
  transition: max-height .3s ease, opacity .25s ease, margin .25s ease;
  opacity: 1;
  margin-bottom: 0;
}
.mise-section.collapsed .sec-items { max-height: 0; opacity: 0; }

/* Checklist items (shared by equipment + ingredients) */
.check-item {
  display: flex; align-items: flex-start; gap: 12px;
  padding: 9px 0; border-bottom: 1px solid var(--border);
  cursor: pointer; transition: opacity .15s; user-select: none;
}
.check-item:last-child { border-bottom: none; }
.check-item.ck { opacity: .38; }
.check-item.ck .check-name { text-decoration: line-through; }
.cb {
  width: 18px; height: 18px; border: 1.5px solid var(--dim);
  border-radius: 4px; flex-shrink: 0; margin-top: 2px;
  display: flex; align-items: center; justify-content: center;
  transition: all .15s;
}
.check-item.ck .cb { background: var(--green); border-color: var(--green); }
.cb-mark { color: white; font-size: 10px; font-weight: 700; opacity: 0; line-height: 1; }
.check-item.ck .cb-mark { opacity: 1; }
.check-name { font-size: 14px; color: var(--text); flex: 1; line-height: 1.5; }
.check-note { font-size: 12px; color: var(--muted); margin-top: 2px; }

/* Steps */
.step-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 12px; margin-bottom: 10px; transition: opacity .15s;
}
.step-card.done { opacity: .32; }
.step-hdr { display: flex; align-items: flex-start; gap: 13px; padding: 16px 18px; }
.step-num {
  width: 28px; height: 28px; border-radius: 50%;
  background: var(--surface3); color: var(--muted);
  font-size: 13px; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; transition: all .2s; margin-top: 1px;
}
.step-card.done .step-num { background: var(--green-bg); color: var(--green); }
.step-inner { flex: 1; }
.step-lbl-row {
  display: flex; align-items: center;
  justify-content: space-between; gap: 10px;
  margin-bottom: 5px;
}
.step-lbl {
  font-size: 11px; font-weight: 700; letter-spacing: 1.5px;
  color: var(--muted); text-transform: uppercase;
}
.step-txt { font-size: 14px; line-height: 1.8; color: var(--text); }
.step-tip {
  font-size: 13px; color: var(--muted); font-style: italic;
  margin-top: 9px; line-height: 1.5;
  padding-left: 10px; border-left: 2px solid var(--border);
}
.step-ftr {
  display: flex; gap: 6px; padding: 2px 18px 14px 59px;
  flex-wrap: wrap; align-items: center;
}

/* Timer controls */
.t-set { display: inline-flex; align-items: center; gap: 3px; }
.t-adj {
  width: 26px; height: 28px;
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: 6px; color: var(--muted); font-size: 16px;
  display: flex; align-items: center; justify-content: center;
  transition: all .15s; flex-shrink: 0; line-height: 1;
}
.t-adj:hover { color: var(--text); border-color: var(--border-mid); background: var(--surface3); }
.t-btn {
  display: inline-flex; align-items: center; gap: 5px;
  background: var(--surface2); border: 1px solid var(--border);
  color: var(--text); font-size: 12px; font-weight: 600;
  padding: 5px 10px; border-radius: 6px; height: 28px;
  white-space: nowrap; transition: border-color .15s, color .15s, background .15s;
}
.t-btn:hover { border-color: var(--border-mid); }
.t-btn.running { border-color: var(--red); color: var(--red); background: var(--red-bg); }
.t-btn.warn30  { border-color: var(--warn-bdr); color: var(--warn); background: var(--warn-bg); }
.t-btn.fin     { border-color: var(--warn-bdr); color: var(--warn); animation: amberpulse 1.2s ease-in-out infinite; }
.done-btn {
  display: inline-flex; align-items: center; gap: 5px;
  background: none; border: 1px solid var(--border);
  color: var(--muted); font-size: 12px;
  padding: 5px 10px; border-radius: 6px; height: 28px;
  transition: all .15s;
}
.done-btn:hover { border-color: var(--border-mid); color: var(--text); }
.step-card.done .done-btn { color: var(--green); border-color: var(--green-bdr); }

/* Collapsible step detail */
.step-detail, .step-timers {
  overflow: hidden;
  max-height: 600px;
  opacity: 1;
  transition: max-height .3s ease, opacity .25s ease;
}
.step-card.done .step-detail,
.step-card.done .step-timers,
.step-card.done .step-ftr {
  max-height: 0;
  opacity: 0;
  padding: 0;
}

/* Ingredient refs in steps */
.qref {
  border-bottom: 1px dashed var(--border-mid);
  cursor: default; white-space: nowrap;
}

/* Tooltip */
#tooltip {
  position: fixed; display: none; z-index: 999;
  background: var(--text); color: var(--bg);
  border-radius: 6px; padding: 5px 10px;
  font-size: 12px; font-weight: 600;
  pointer-events: none; white-space: nowrap;
  transform: translateX(-50%);
  box-shadow: 0 2px 8px rgba(0,0,0,0.15);
}

/* Variant callout */
.variant-card {
  background: var(--surface2); border: 1px solid var(--border);
  border-left: 3px solid var(--accent); border-radius: 8px;
  padding: 13px 16px; margin-bottom: 12px;
}
.variant-hdr {
  display: flex; align-items: center; gap: 8px;
  font-size: 11px; font-weight: 700; letter-spacing: 1.5px;
  text-transform: uppercase; color: var(--accent); margin-bottom: 6px;
}
.variant-body { font-size: 13px; line-height: 1.7; color: var(--text); }

.share-btn {
  background: none; border: 1px solid var(--border); color: var(--muted);
  font-size: 12px; padding: 5px 10px; border-radius: 6px;
  transition: all .15s; white-space: nowrap; flex-shrink: 0;
}
.share-btn:hover { color: var(--text); border-color: var(--border-mid); }
.share-btn.copied { color: var(--green); border-color: var(--green-bdr); background: var(--green-bg); }

@media (max-width: 520px) {
  .preheat-badge { display: none; }
  .share-btn { display: none; }
  #hdr-title { font-size: 13px; }
}

</style>
</head>
<body>

<!-- ===== LIBRARY ===== -->
<div id="lib-view">
  <div class="lib-hdr">
    <h1>EL <span>YES!</span> cookbook</h1>
  </div>
  <div class="filter-bar" id="filter-bar">
    <input class="filter-search" id="filter-search" type="search" placeholder="Search recipes…" oninput="renderLibrary()" autocomplete="off">
    <button class="filter-btn" data-tag="chicken" onclick="toggleFilter('chicken')">chicken</button>
    <button class="filter-btn" data-tag="beef" onclick="toggleFilter('beef')">beef</button>
    <button class="filter-btn" data-tag="lamb" onclick="toggleFilter('lamb')">lamb</button>
    <button class="filter-btn" data-tag="seafood" onclick="toggleFilter('seafood')">seafood</button>
    <button class="filter-btn" data-tag="30 or less" onclick="toggleFilter('30 or less')">30 or less</button>
    <button class="filter-btn" data-tag="under 1 hr" onclick="toggleFilter('under 1 hr')">under 1 hr</button>
    <button class="filter-btn" data-tag="slow roll" onclick="toggleFilter('slow roll')">slow roll</button>
    <button class="filter-btn" data-tag="grill" onclick="toggleFilter('grill')">grill</button>
    <button class="filter-btn" data-tag="sauce" onclick="toggleFilter('sauce')">sauce</button>
    <button class="filter-btn" data-tag="make-ahead" onclick="toggleFilter('make-ahead')">make-ahead</button>
    <button class="filter-btn" data-tag="batch" onclick="toggleFilter('batch')">batch</button>
    <button class="filter-btn" data-tag="dessert" onclick="toggleFilter('dessert')">dessert</button>
    <span class="filter-count" id="filter-count"></span>
  </div>
  <div class="recipe-grid" id="recipe-grid"></div>
</div>

<!-- ===== COOK VIEW ===== -->
<div id="timer-bar">
  <div class="t-pills" id="t-pills"></div>
</div>

<div id="cook-view">

  <div id="cook-hdr">
    <button class="back-btn" onclick="goLib()">← recipes</button>
    <div id="hdr-title"></div>
    <div class="preheat-badge" id="preheat-badge" style="display:none"></div>
    <button class="share-btn" id="share-btn" onclick="copyLink()">copy link</button>
    <div class="scale-toggle">
      <button class="scale-btn on" id="scale-1" onclick="setScale(1)">1×</button>
      <button class="scale-btn"    id="scale-2" onclick="setScale(2)">2×</button>
      <button class="scale-btn"    id="scale-3" onclick="setScale(3)">3×</button>
    </div>
  </div>

  <div id="cook-body">
    <div class="cook-tabs">
      <button class="cook-tab on" id="tab-mise" onclick="swTab('mise',this)">MISE EN PLACE</button>
      <button class="cook-tab"    id="tab-cook" onclick="swTab('cook',this)">COOK</button>
    </div>
    <div class="cook-pane on" id="pane-mise"></div>
    <div class="cook-pane"    id="pane-cook">
      <div id="variants-container"></div>
      <div id="steps-container"></div>
    </div>
  </div>

</div>

<div id="tooltip"></div>

<script>

// =====================================================================
// RECIPE DATA
// Scale 1 = 1 person, 2 = 2 people, 3 = 3 people
// byScale: { 1: 'qty for 1', 2: 'qty for 2', 3: 'qty for 3' }
// items without byScale don't change with scale (oils, salt, etc.)
// refs.tips: { 1: '...', 2: '...', 3: '...' } for ingredient tooltips
// =====================================================================

const RECIPES = [
{
  id: 'vadouvan-chicken',
  title: 'The Spice Must Flow',
  style: 'Dry rub · cast iron sear · arrowroot pan gravy',
  subtitle: 'Haiga rice · charred broccoli · sweet potato mash',
  preheat: '425°F',
  serves: '1–3',
  tags: ['chicken', 'under 1 hr'],
  prepTime: '15 min',
  cookTime: '45 min',

  equipment: [
    { name: '12-inch cast iron skillet',          note: 'for the sear and gravy — needs to be big enough for all the thighs flat' },
    { name: 'Two sheet pans',                      note: 'one for sweet potatoes, one for broccoli' },
    { name: 'Zojirushi rice cooker' },
    { name: 'Meat thermometer',                    note: 'pull thighs at 165°F' },
    { name: 'Small bowl for arrowroot slurry' }
  ],

  mise: [
    { group: 'Chicken', items: [
      { byScale: { 1: '2 boneless skinless chicken thighs',  2: '4 boneless skinless chicken thighs',  3: '6 boneless skinless chicken thighs'  }, note: 'pat dry' },
      { byScale: { 1: '¾ tsp vadouvan',                     2: '1½ tsp vadouvan',                      3: '2¼ tsp vadouvan'                      } },
      { byScale: { 1: '½ tsp garlic granules',              2: '1 tsp garlic granules',                3: '1½ tsp garlic granules'               } },
      { byScale: { 1: '¼ tsp black pepper',                 2: '½ tsp black pepper',                   3: '¾ tsp black pepper'                   } },
      { name: 'Salt, generous' },
      { name: 'Avocado oil' }
    ]},
    { group: 'Pan gravy', items: [
      { byScale: { 1: '1–2 garlic cloves, minced',          2: '3 garlic cloves, minced',              3: '4–5 garlic cloves, minced'            } },

      text:  'Ladle beans into a deep bowl, broth and all. Pile pickled spring onions on top — generously, the acid is the whole point. Finish with Graza Drizzle. Charred broccoli alongside.',
      tip:   null,
      timers: []
    }
  ]
}
];

const PLACEHOLDERS = [
  { title: 'Salmon with crispy skin', subtitle: 'Wild rice · broccolini', tags: ['fish', 'weeknight'] }
];

// =====================================================================
// STATE
// =====================================================================

let currentRecipe  = null;
let currentScale   = 2;     // default: cooking for 2
let T              = {};
let audioCtx       = null;
let tipTimeout     = null;
let activeFilters  = new Set();

// =====================================================================
// LIBRARY
// =====================================================================

function toggleFilter(tag) {
  if (activeFilters.has(tag)) activeFilters.delete(tag);
  else activeFilters.add(tag);
  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.classList.toggle('active', activeFilters.has(btn.dataset.tag));
  });
  renderLibrary();
}

function renderLibrary() {
  const grid = document.getElementById('recipe-grid');
  const query = (document.getElementById('filter-search')?.value || '').toLowerCase().trim();
  grid.innerHTML = '';

  const visible = RECIPES.filter(r => {
    const matchTag = activeFilters.size === 0 || [...activeFilters].every(f => r.tags.includes(f));
    const matchSearch = !query ||
      r.title.toLowerCase().includes(query) ||
      r.subtitle.toLowerCase().includes(query) ||
      r.tags.some(t => t.toLowerCase().includes(query));
    return matchTag && matchSearch;
  });

  const countEl = document.getElementById('filter-count');
  if (countEl) {
    countEl.textContent = (activeFilters.size > 0 || query)
      ? `${visible.length} of ${RECIPES.length}`
      : '';
  }

  visible.forEach(r => {
    const card = document.createElement('div');
    card.className = 'recipe-card';
    card.onclick = () => loadRecipe(r.id);
    const timeHtml = (r.prepTime || r.cookTime) ? `
      <div class="card-time">
        ${r.prepTime ? `<span class="card-time-item"><span class="card-time-lbl">prep</span> <span class="card-time-val">${r.prepTime}</span></span>` : ''}
        ${r.cookTime ? `<span class="card-time-item"><span class="card-time-lbl">cook</span> <span class="card-time-val">${r.cookTime}</span></span>` : ''}
      </div>` : '';
    card.innerHTML = `
      <div class="card-tags">${r.tags.map(t => `<span class="card-tag">${t}</span>`).join('')}</div>
      <div class="card-title">${r.title}</div>
      ${r.style ? `<div class="card-style">${r.style}</div>` : ''}
      <div class="card-sub">${r.subtitle}</div>
      ${timeHtml}
    `;
    grid.appendChild(card);
  });

  if (!activeFilters.size && !query) {
    PLACEHOLDERS.forEach(p => {
      const card = document.createElement('div');
      card.className = 'recipe-card placeholder';
      card.innerHTML = `
        <div class="card-tags">${p.tags.map(t => `<span class="card-tag">${t}</span>`).join('')}</div>
        <div class="card-title">${p.title}</div>
        <div class="card-sub">${p.subtitle}</div>
        <div class="card-soon">coming soon</div>
      `;
      grid.appendChild(card);
    });
  }
}

function goLib() {
  currentRecipe = null;
  document.getElementById('lib-view').style.display = '';
  document.getElementById('cook-view').classList.remove('active');
  document.title = 'EL YES! Cookbook';
  history.pushState(null, '', location.pathname);
  window.scrollTo(0, 0);
  renderBar();
}

// =====================================================================
// COOK MODE
// =====================================================================

function loadRecipe(id) {
  currentRecipe = RECIPES.find(r => r.id === id);
  if (!currentRecipe) return;

  currentScale = 2;   // default to 2 people
  [1,2,3].forEach(n => {
    document.getElementById('scale-' + n).classList.toggle('on', n === currentScale);
  });

  // init timers for this recipe only if not already in T (preserve running state across nav)
  Object.entries(currentRecipe.timers).forEach(([tid, td]) => {
    const key = currentRecipe.id + '__' + tid;
    if (!T[key]) {
      T[key] = { recipeId: currentRecipe.id, recipeTitle: currentRecipe.title,
                 label: td.label, preset: td.preset, rem: td.preset,
                 bell: td.bell, running: false, alerted: false, iv: null };
    }
  });

  document.getElementById('hdr-title').textContent = currentRecipe.title;
  const pb = document.getElementById('preheat-badge');
  if (currentRecipe.preheat) { pb.textContent = '🔥 ' + currentRecipe.preheat; pb.style.display = ''; }
  else pb.style.display = 'none';

  renderMise();
  renderVariants();
  renderSteps();
  syncTimerUI();

  document.querySelectorAll('.cook-pane').forEach(p => p.classList.remove('on'));
  document.querySelectorAll('.cook-tab').forEach(b => b.classList.remove('on'));
  document.getElementById('pane-mise').classList.add('on');
  document.getElementById('tab-mise').classList.add('on');

  document.getElementById('lib-view').style.display = 'none';
  document.getElementById('cook-view').classList.add('active');
  document.title = currentRecipe.title + ' — EL YES!';
  history.pushState({ recipeId: id }, '', '#' + id);
  window.scrollTo(0, 0);
}

function setScale(n) {
  currentScale = n;
  [1,2,3].forEach(i => {
    document.getElementById('scale-' + i).classList.toggle('on', i === n);
  });
  renderMise();
  renderSteps();
}

function swTab(id, btn) {
  document.querySelectorAll('.cook-pane').forEach(p => p.classList.remove('on'));
  document.querySelectorAll('.cook-tab').forEach(b => b.classList.remove('on'));
  document.getElementById('pane-' + id).classList.add('on');
  btn.classList.add('on');
}

// =====================================================================
// MISE (equipment + ingredients)
// =====================================================================

function renderMise() {
  const pane = document.getElementById('pane-mise');
  pane.innerHTML = '';
  if (currentRecipe.headnote) {
    const hn = document.createElement('div');
    hn.className = 'recipe-headnote';
    hn.innerHTML = currentRecipe.headnote;
    pane.appendChild(hn);
  }
  let sIdx = 0;

  function makeSection(title, items) {
    const sid = 'mise-sec-' + sIdx++;
    const section = document.createElement('div');
    section.className = 'mise-section';
    section.id = sid;

    const lbl = document.createElement('div');
    lbl.className = 'sec-lbl';
    lbl.innerHTML = `<div class="sec-cb"><span class="sec-cb-mark">✓</span></div>${title}`;
    lbl.onclick = () => section.classList.toggle('collapsed');

    const itemsDiv = document.createElement('div');
    itemsDiv.className = 'sec-items';

    items.forEach(item => {
      const displayName = item.byScale ? item.byScale[currentScale] : item.name;
      const div = document.createElement('div');
      div.className = 'check-item';
      div.innerHTML = `
        <div class="cb"><span class="cb-mark">✓</span></div>
        <div class="check-name">
          ${displayName}
          ${item.note ? `<div class="check-note">${item.note}</div>` : ''}
        </div>
      `;
      div.onclick = () => div.classList.toggle('ck');
      itemsDiv.appendChild(div);
    });

    section.appendChild(lbl);
    section.appendChild(itemsDiv);
    pane.appendChild(section);
  }

  if (currentRecipe.equipment && currentRecipe.equipment.length) {
    makeSection('Equipment', currentRecipe.equipment);
  }
  currentRecipe.mise.forEach(group => makeSection(group.group, group.items));
}

// =====================================================================
// STEPS
// =====================================================================

function parseText(text) {
  return text.replace(/\{\{([\w-]+)\}\}/g, (_, id) => {
    const ref = currentRecipe.refs[id];
    if (!ref) return id;
    const tip = ref.tips[currentScale] || ref.tips[2];
    return `<span class="qref" data-tip="${tip}">${ref.display}</span>`;
  });
}

function renderSteps() {
  const container = document.getElementById('steps-container');
  container.innerHTML = '';

  currentRecipe.steps.forEach((step, i) => {
    const card = document.createElement('div');
    card.className = 'step-card';
    card.id = 'step-' + i;

    let timerHtml = '';
    step.timers.forEach(tid => {
      const key = currentRecipe.id + '__' + tid;
      if (!T[key]) return;
      const icon = T[key].bell ? '🔔' : '⏱';
      timerHtml += `
        <div class="t-set">
          <button class="t-adj" onclick="adjTimer('${key}',-60)">−</button>
          <button class="t-btn" id="tbtn-${key}" onclick="toggleTimer('${key}',this)">
            ${icon} <span id="tlbl-${key}">${T[key].label} · ${fmt(T[key].preset)}</span>
          </button>
          <button class="t-adj" onclick="adjTimer('${key}',60)">+</button>
        </div>
      `;
    });

    card.innerHTML = `
      <div class="step-hdr">
        <div class="step-num">${i + 1}</div>
        <div class="step-inner">
          <div class="step-lbl-row">
            <div class="step-lbl">${step.label}</div>
            <button class="done-btn" onclick="markDone(this,'step-${i}')">✓ done</button>
          </div>
          <div class="step-detail">
            <div class="step-txt">${parseText(step.text)}</div>
            ${step.tip ? `<div class="step-tip">${step.tip}</div>` : ''}
          </div>
        </div>
      </div>
      ${timerHtml ? `<div class="step-ftr"><div class="step-timers">${timerHtml}</div></div>` : ''}
    `;
    container.appendChild(card);
  });

  bindTooltips();
}

function markDone(btn, cardId) {
  const card = document.getElementById(cardId);
  card.classList.toggle('done');
  btn.textContent = card.classList.contains('done') ? '↩ undo' : '✓ done';
}

// =====================================================================
// TOOLTIPS
// =====================================================================

function bindTooltips() {
  const tip = document.getElementById('tooltip');
  document.querySelectorAll('.qref').forEach(el => {
    const show = () => {
      clearTimeout(tipTimeout);
      tip.textContent = el.dataset.tip;
      tip.style.display = 'block';
      const r  = el.getBoundingClientRect();
      let left = r.left + r.width / 2;
      const tw = tip.offsetWidth;
      left = Math.max(tw/2 + 8, Math.min(left, window.innerWidth - tw/2 - 8));
      tip.style.left = left + 'px';
      tip.style.top  = (r.top - tip.offsetHeight - 8) + 'px';
    };
    const hide = () => { tipTimeout = setTimeout(() => { tip.style.display = 'none'; }, 100); };
    el.addEventListener('mouseenter', show);
    el.addEventListener('mouseleave', hide);
    el.addEventListener('click', e => { e.stopPropagation(); tip.style.display === 'block' ? hide() : show(); });
  });
}

// =====================================================================
// TIMER SYSTEM
// =====================================================================

function fmt(s) {
  if (s <= 0) return '0:00';
  if (s < 60)  return s + 's';
  const m = Math.floor(s / 60), sc = s % 60;
  return m + ':' + (sc < 10 ? '0' : '') + sc;
}

function updateBtnLabel(id) {
  const t = T[id], el = document.getElementById('tlbl-' + id);
  if (!el) return;
  if (t.running) el.textContent = t.label + ' · ' + fmt(t.rem);
  else if (t.alerted) el.textContent = t.label + ' · done ✕';
  else el.textContent = t.label + ' · ' + fmt(t.preset);
}

function renderBar() {
  const bar      = document.getElementById('timer-bar');
  const pills    = document.getElementById('t-pills');
  const cookBody = document.getElementById('cook-body');
  const libView  = document.getElementById('lib-view');
  const active   = Object.entries(T).filter(([, t]) => t.running || t.alerted);

  if (!active.length) {
    bar.classList.remove('vis');
    cookBody.classList.remove('bar-vis');
    libView.classList.remove('bar-vis');
    pills.innerHTML = '';
    return;
  }
  bar.classList.add('vis');
  cookBody.classList.add('bar-vis');
  libView.classList.add('bar-vis');

  pills.innerHTML = active.map(([id, t]) => {
    const isOther = t.recipeId !== currentRecipe?.id;
    const srcTag  = isOther
      ? `<span class="t-pill-src" onclick="event.stopPropagation();loadRecipe('${t.recipeId}')" title="${t.recipeTitle}">↗ ${t.recipeTitle}</span>`
      : '';
    if (t.alerted) {
      return `<span class="t-pill alerted" onclick="dismissAlert('${id}')" title="tap to dismiss">${srcTag}<span class="t-name">${t.label}</span><span class="t-count">done ✕</span></span>`;
    }
    const urg = t.rem <= 60 ? ' urg' : '';
    return `<span class="t-pill${urg}">${srcTag}<span class="t-name">${t.label}</span><span class="t-count">${fmt(t.rem)}</span></span>`;
  }).join('');
}

function syncTimerUI() {
  if (!currentRecipe) return;
  Object.entries(currentRecipe.timers).forEach(([tid]) => {
    const key = currentRecipe.id + '__' + tid;
    const t   = T[key];
    if (!t) return;
    const btn = document.getElementById('tbtn-' + key);
    if (!btn) return;
    btn.classList.remove('running', 'fin', 'warn30');
    if (t.running) btn.classList.add('running');
    else if (t.alerted) btn.classList.add('fin');
    else if (t.rem <= 30 && t.rem < t.preset) btn.classList.add('warn30');
    updateBtnLabel(key);
  });
  renderBar();
}

function dismissAlert(id) {
  const t = T[id]; t.alerted = false; t.rem = t.preset;
  const btn = document.getElementById('tbtn-' + id);
  if (btn) btn.classList.remove('fin', 'warn30');
  updateBtnLabel(id); renderBar();
}

function toggleTimer(id, btn) {
  unlockAudio();
  const t = T[id];
  if (t.alerted) { dismissAlert(id); return; }
  if (t.running) {
    clearInterval(t.iv); t.running = false;
    btn.classList.remove('running', 'warn30');
    updateBtnLabel(id); renderBar(); return;
  }
  if (t.iv) clearInterval(t.iv);
  t.rem = t.rem > 0 ? t.rem : t.preset;
  t.running = true;
  btn.classList.add('running'); btn.classList.remove('fin', 'warn30');
  renderBar(); updateBtnLabel(id);

  t.iv = setInterval(() => {
    t.rem--;
    if (t.rem === 30) { playWarn(); btn.classList.remove('running'); btn.classList.add('warn30'); }
    updateBtnLabel(id); renderBar();
    if (t.rem <= 0) {
      clearInterval(t.iv); t.running = false; t.alerted = true;
      btn.classList.remove('running', 'warn30'); btn.classList.add('fin');
      playDone(); updateBtnLabel(id); renderBar();
    }
  }, 1000);
}

function adjTimer(id, delta) {
  const t = T[id], btn = document.getElementById('tbtn-' + id);
  if (t.running) { t.rem = Math.max(5, t.rem + delta); renderBar(); updateBtnLabel(id); }
  else { t.preset = Math.max(5, t.preset + delta); t.rem = t.preset; if (t.alerted) { t.alerted = false; if (btn) btn.classList.remove('fin','warn30'); } updateBtnLabel(id); }
}

// =====================================================================
// AUDIO
// =====================================================================

function unlockAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}

function tone(freq, start, dur, vol) {
  if (!audioCtx) return;
  if (audioCtx.state === 'suspended') audioCtx.resume();
  vol = vol || 0.28;
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.connect(g); g.connect(audioCtx.destination);
  o.type = 'sine'; o.frequency.value = freq;
  g.gain.setValueAtTime(0, audioCtx.currentTime + start);
  g.gain.linearRampToValueAtTime(vol, audioCtx.currentTime + start + 0.02);
  g.gain.linearRampToValueAtTime(0, audioCtx.currentTime + start + dur);
  o.start(audioCtx.currentTime + start);
  o.stop(audioCtx.currentTime + start + dur + 0.05);
}

function playWarn() {
  try { unlockAudio(); tone(440,0,0.12,0.16); tone(550,0.18,0.12,0.16); } catch(e) {}
}
function playDone() {
  try { unlockAudio(); tone(660,0,0.18); tone(880,0.22,0.18); tone(1100,0.44,0.28,0.22); } catch(e) {}
}

// =====================================================================
// NOTES
// =====================================================================

function renderVariants() {
  const container = document.getElementById('variants-container');
  container.innerHTML = '';
  if (!currentRecipe.variants || !currentRecipe.variants.length) return;
  currentRecipe.variants.forEach(v => {
    const card = document.createElement('div');
    card.className = 'variant-card';
    card.innerHTML = `
      <div class="variant-hdr">⚡ variant — ${v.name}</div>
      <div class="variant-body">${v.notes}</div>
    `;
    container.appendChild(card);
  });
}

// =====================================================================
// SHARE / DEEP LINK
// =====================================================================

function copyLink() {
  navigator.clipboard.writeText(location.href).then(() => {
    const btn = document.getElementById('share-btn');
    btn.textContent = '✓ copied';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = 'copy link'; btn.classList.remove('copied'); }, 2000);
  });
}

window.addEventListener('popstate', e => {
  if (e.state && e.state.recipeId) {
    loadRecipe(e.state.recipeId);
  } else {
    goLib();
  }
});

// =====================================================================
// INIT
// =====================================================================
renderLibrary();
const _initHash = location.hash.slice(1);
if (_initHash && RECIPES.find(r => r.id === _initHash)) loadRecipe(_initHash);

</script>
